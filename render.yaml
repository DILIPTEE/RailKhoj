# Render blueprint for RailKhoj (bd-train-tracker).
# ONE Node service = Express API + built React frontend (web/dist), same origin.
# No database, no persistent disk needed — the FREE plan works fine here.
# (Free sleeps after ~15 min idle; change plan to `starter` for 24/7 uptime.)
#
# IMPORTANT: `npm run build` at the repo root is self-installing — it first
# runs install:all (server/ + web/ with dev deps, so vite IS installed) and
# then builds the frontend. Even if the Render dashboard has the wrong build
# command (e.g. plain `npm run build` with no npm install), it still works.
services:
  - type: web
    name: railkhoj
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Used for canonical/OG links — set to your real URL when Render asks
      # (e.g. https://railkhoj.onrender.com or your custom domain).
      - key: SITE_URL
        sync: false